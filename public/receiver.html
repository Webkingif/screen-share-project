<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS_RECEIVER // WebRTC</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>WINDOWS SCREEN RECEIVER</h1>

    <div class="panel">
        <p><strong>[ STATUS ]</strong> <span id="status">Waiting for uplink...</span></p>
    </div>

    <!-- The autoplay and playsinline attributes are critical for mobile browsers -->
    <video id="remote-video" autoplay playsinline muted></video>

    <div class="controls" style="margin-top: 20px;">
        <button id="fullscreen-btn">FULL SCREEN</button>
        <button id="disconnect-btn">DISCONNECT</button>
    </div>

    <div class="panel" style="margin-bottom: 20px;">
        <p><strong>[ CLIPBOARD_TRANSFER ]</strong></p>
        <textarea id="clipboard-input" rows="3"
            style="width: 95%; background: var(--bg-color); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 10px; margin-bottom: 10px;"
            placeholder="Paste text here..."></textarea>
        <br>
        <button id="send-text-btn">TRANSMIT TEXT</button>

        <div style="margin-top: 15px; display: flex; align-items: center; gap: 10px;">
            <strong>[ INCOMING_DATA ]:</strong>
            <span id="received-text">None</span>
            <!-- The new copy button -->
            <button id="copy-btn" style="padding: 5px 10px; font-size: 0.8em; display: none;">COPY</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/receiver.js"></script>
</body>

</html>
